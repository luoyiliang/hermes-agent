name: Windows venv-holder live E2E

# THROWAWAY wine2e branch: loops the Job Object mechanism tests
# (test_gateway_job_teardown_live.py) on a real Windows runner. Never merge.

on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-teardown-loop:
    name: job-teardown loop (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest-32-core, windows-latest-32-arm-core]
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up native ARM64 build dependencies
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/setup-windows-build-deps

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Loop the Job Object mechanism tests
        shell: bash
        run: |
          set -uo pipefail
          python .github/wine2e_job_teardown_loop.py
